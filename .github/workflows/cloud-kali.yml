name: 🖥️ CYNET Cloud Ubuntu Linux SSH

on:
  workflow_dispatch:

jobs:
  launch-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📦 Setup Ubuntu 24.04 + SSH
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e

          echo "=========================================================="
          echo "  🖥️ STARTING UBUNTU 24.04 SSH SERVER"
          echo "=========================================================="

          sudo apt-get update -y -q

          # نصب ngrok
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            | sudo tar -xz -C /usr/local/bin

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # اجرای Ubuntu 24.04
          docker run -d \
            --name cynet-ubuntu \
            --network host \
            ubuntu:24.04 \
            tail -f /dev/null

          # نصب ابزارها + SSH Server
          docker exec cynet-ubuntu apt-get update -y

          docker exec cynet-ubuntu apt-get install -y -q \
            openssh-server \
            sudo \
            curl \
            wget \
            git \
            nano \
            vim \
            unzip \
            zip \
            tar \
            gzip \
            ca-certificates \
            gnupg \
            lsb-release \
            software-properties-common \
            net-tools \
            iproute2 \
            iputils-ping \
            dnsutils \
            openssh-client \
            python3 \
            python3-pip \
            python3-venv \
            build-essential \
            gcc \
            g++ \
            make \
            tmux \
            screen \
            htop \
            jq \
            rsync \
            socat \
            zsh

          # آماده‌سازی SSH
          docker exec cynet-ubuntu mkdir -p /run/sshd

          # تنظیم رمز root
          docker exec cynet-ubuntu bash -c \
            "echo 'root:${SSH_PASSWORD}' | chpasswd"

          # فعال کردن ورود SSH با password
          docker exec cynet-ubuntu bash -c \
            "sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config"

          docker exec cynet-ubuntu bash -c \
            "sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config"

          # اجرای SSH
          docker exec -d cynet-ubuntu \
            /usr/sbin/sshd -D

          sleep 3

          echo "SSH server started."

      - name: 🌐 Start ngrok SSH Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -e

          echo "=========================================================="
          echo "  🌐 STARTING NGROK TCP TUNNEL"
          echo "=========================================================="

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          nohup ngrok tcp 22 > ngrok.log 2>&1 &

          sleep 5

          echo ""
          echo "=========================================================="
          echo "  🔥 YOUR UBUNTU SSH SERVER IS LIVE"
          echo "=========================================================="

          curl -s http://127.0.0.1:4040/api/tunnels \
            | python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          for tunnel in data.get("tunnels", []):
              url = tunnel.get("public_url", "")

              if url.startswith("tcp://"):
                  address = url.replace("tcp://", "")
                  host, port = address.rsplit(":", 1)

                  print("")
                  print("SSH Host : " + host)
                  print("SSH Port : " + port)
                  print("")
                  print("SSH Command:")
                  print("ssh root@" + host + " -p " + port)
                  print("")
          '

          echo "=========================================================="
          echo "  ⏳ Server remains online until the GitHub job ends."
          echo "=========================================================="

          tail -f ngrok.log
