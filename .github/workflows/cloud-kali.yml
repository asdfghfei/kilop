name: 🖥️ CYNET Cloud Ubuntu Linux SSH

on:
  workflow_dispatch:

jobs:
  launch-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. SETUP UBUNTU 24.04 + SSH
      # ==========================================================
      - name: 📦 Setup Ubuntu 24.04 + SSH Server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

        run: |
          set -e

          echo "=========================================================="
          echo "  🖥️ CYNET CLOUD UBUNTU 24.04"
          echo "  🔐 SSH SERVER SETUP"
          echo "=========================================================="

          sudo apt-get update -y -q

          # Docker is already available on GitHub runner
          docker --version

          # ------------------------------------------------------
          # Pull Ubuntu
          # ------------------------------------------------------
          echo ""
          echo "📥 Pulling Ubuntu 24.04..."

          docker pull ubuntu:24.04

          docker rm -f cynet-ubuntu 2>/dev/null || true

          # ------------------------------------------------------
          # Start Ubuntu container
          # ------------------------------------------------------
          echo ""
          echo "🚀 Starting Ubuntu 24.04..."

          docker run -d \
            --name cynet-ubuntu \
            --network host \
            ubuntu:24.04 \
            tail -f /dev/null

          # ------------------------------------------------------
          # Update packages
          # ------------------------------------------------------
          echo ""
          echo "🔄 Updating Ubuntu..."

          docker exec cynet-ubuntu \
            apt-get update -y

          # ------------------------------------------------------
          # Install SSH + common tools
          # ------------------------------------------------------
          echo ""
          echo "📦 Installing SSH and tools..."

          docker exec cynet-ubuntu \
            env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              openssh-server \
              openssh-client \
              sudo \
              curl \
              wget \
              git \
              nano \
              vim \
              unzip \
              zip \
              tar \
              gzip \
              ca-certificates \
              python3 \
              python3-pip \
              python3-venv \
              build-essential \
              gcc \
              g++ \
              make \
              tmux \
              htop \
              jq \
              rsync \
              zsh \
              iproute2 \
              iputils-ping \
              dnsutils \
              net-tools

          # ------------------------------------------------------
          # Prepare SSH
          # ------------------------------------------------------
          echo ""
          echo "🔐 Preparing SSH..."

          docker exec cynet-ubuntu \
            mkdir -p /run/sshd

          docker exec cynet-ubuntu \
            ssh-keygen -A

          # ------------------------------------------------------
          # Set root password
          # ------------------------------------------------------
          printf 'root:%s\n' "$SSH_PASSWORD" \
            | docker exec -i cynet-ubuntu chpasswd

          # ------------------------------------------------------
          # SSH configuration
          # ------------------------------------------------------
          docker exec cynet-ubuntu bash -c '
            cat > /etc/ssh/sshd_config.d/cynet.conf << "EOF"
          Port 22
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM yes
          PrintMotd no
          X11Forwarding no
          EOF
          '

          # ------------------------------------------------------
          # Test SSH configuration
          # ------------------------------------------------------
          docker exec cynet-ubuntu \
            /usr/sbin/sshd -t

          # ------------------------------------------------------
          # Start SSH
          # ------------------------------------------------------
          echo ""
          echo "🚀 Starting SSH server..."

          docker exec -d cynet-ubuntu \
            /usr/sbin/sshd -D

          sleep 3

          # ------------------------------------------------------
          # Verify SSH
          # ------------------------------------------------------
          if docker exec cynet-ubuntu \
            bash -c "ss -lnt | grep -q ':22 ';"; then

            echo "✅ SSH is listening on port 22"

          else

            echo "❌ SSH failed to start"

            docker exec cynet-ubuntu \
              ps aux | grep '[s]shd' || true

            docker exec cynet-ubuntu \
              ss -lnt || true

            exit 1
          fi

          echo ""
          echo "=========================================================="
          echo "  ✅ UBUNTU 24.04 READY"
          echo "  ✅ SSH SERVER READY"
          echo "=========================================================="


      # ==========================================================
      # 2. PINGGY SSH TCP TUNNEL
      # ==========================================================
      - name: 🌐 Start Pinggy SSH Tunnel
        run: |
          set -e

          echo ""
          echo "=========================================================="
          echo "  🌐 STARTING PINGGY TCP TUNNEL"
          echo "=========================================================="

          # ------------------------------------------------------
          # Start Pinggy
          #
          # Pinggy uses SSH reverse port forwarding.
          # Local port 22 -> public TCP endpoint
          # ------------------------------------------------------

          echo ""
          echo "🚀 Connecting to Pinggy..."

          rm -f pinggy.log

          (
            printf '\n' | \
            ssh \
              -p 443 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              -N \
              -T \
              -R0:127.0.0.1:22 \
              tcp@free.pinggy.io
          ) > pinggy.log 2>&1 &

          PINGGY_PID=$!

          echo "Pinggy PID: $PINGGY_PID"

          # ------------------------------------------------------
          # Wait for public address
          # ------------------------------------------------------

          PINGGY_URL=""

          for i in {1..30}; do

            sleep 2

            echo "Checking Pinggy... $i/30"

            # Check process
            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then

              echo ""
              echo "❌ Pinggy process stopped!"
              echo ""
              echo "=============== Pinggy log ==============="
              cat pinggy.log || true
              echo "==========================================="

              exit 1
            fi

            # Search for TCP URL
            PINGGY_URL=$(
              grep -oE 'tcp://[^[:space:]]+' pinggy.log \
              | head -n 1 \
              || true
            )

            if [ -n "$PINGGY_URL" ]; then
              break
            fi

          done

          # ------------------------------------------------------
          # Check result
          # ------------------------------------------------------

          if [ -z "$PINGGY_URL" ]; then

            echo ""
            echo "=========================================================="
            echo "  ❌ COULD NOT GET PINGGY ADDRESS"
            echo "=========================================================="

            echo ""
            echo "=============== Pinggy log ==============="
            cat pinggy.log || true
            echo "==========================================="

            exit 1
          fi

          # ------------------------------------------------------
          # Remove tcp://
          # ------------------------------------------------------

          ADDRESS="${PINGGY_URL#tcp://}"

          HOST="${ADDRESS%:*}"
          PORT="${ADDRESS##*:}"

          # ------------------------------------------------------
          # Display connection information
          # ------------------------------------------------------

          echo ""
          echo ""
          echo "=========================================================="
          echo "  🔥 YOUR UBUNTU SSH SERVER IS LIVE!"
          echo "=========================================================="
          echo ""
          echo "  🖥️ OS       : Ubuntu 24.04"
          echo "  🔐 Service  : SSH"
          echo "  👤 Username : root"
          echo "  🌐 Host     : $HOST"
          echo "  🔌 Port     : $PORT"
          echo ""
          echo "----------------------------------------------------------"
          echo "  SSH COMMAND"
          echo "----------------------------------------------------------"
          echo ""
          echo "  ssh root@$HOST -p $PORT"
          echo ""
          echo "=========================================================="
          echo "  ⏳ GITHUB JOB LIMIT: 360 MINUTES"
          echo "=========================================================="
          echo ""

          # ------------------------------------------------------
          # Keep workflow alive
          # ------------------------------------------------------

          tail -f pinggy.log
