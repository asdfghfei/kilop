name: 🖥️ CYNET Cloud Ubuntu Linux SSH

on:
  workflow_dispatch:

jobs:
  launch-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. SETUP UBUNTU 24.04 + SSH
      # ==========================================================
      - name: 📦 Setup Ubuntu 24.04 + SSH Server
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

        run: |
          set -e

          echo "=========================================================="
          echo "  🖥️ CYNET CLOUD UBUNTU 24.04"
          echo "  🔐 SSH SERVER"
          echo "=========================================================="

          # ------------------------------------------------------
          # Update GitHub runner
          # ------------------------------------------------------
          sudo apt-get update -y -q

          # ------------------------------------------------------
          # Docker is already available on GitHub runner
          # ------------------------------------------------------
          docker --version

          # ------------------------------------------------------
          # Install ngrok
          # ------------------------------------------------------
          echo ""
          echo "📦 Installing ngrok..."

          curl -sSL \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            | sudo tar -xz -C /usr/local/bin

          sudo chmod +x /usr/local/bin/ngrok

          # ------------------------------------------------------
          # Configure ngrok
          # ------------------------------------------------------
          echo ""
          echo "🔑 Configuring ngrok..."

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # ------------------------------------------------------
          # Download Ubuntu 24.04
          # ------------------------------------------------------
          echo ""
          echo "📥 Pulling Ubuntu 24.04..."

          docker pull ubuntu:24.04

          # ------------------------------------------------------
          # Remove previous container
          # ------------------------------------------------------
          docker rm -f cynet-ubuntu 2>/dev/null || true

          # ------------------------------------------------------
          # Start Ubuntu container
          # ------------------------------------------------------
          echo ""
          echo "🚀 Starting Ubuntu container..."

          docker run -d \
            --name cynet-ubuntu \
            --network host \
            ubuntu:24.04 \
            tail -f /dev/null

          # ------------------------------------------------------
          # Update Ubuntu
          # ------------------------------------------------------
          echo ""
          echo "🔄 Updating Ubuntu package lists..."

          docker exec cynet-ubuntu \
            apt-get update -y

          # ------------------------------------------------------
          # Install ONLY required packages
          #
          # Avoid unnecessary packages that can introduce
          # containerd/docker dependency conflicts.
          # ------------------------------------------------------
          echo ""
          echo "📦 Installing SSH and basic tools..."

          docker exec cynet-ubuntu \
            env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              openssh-server \
              openssh-client \
              sudo \
              curl \
              wget \
              git \
              nano \
              vim \
              unzip \
              zip \
              ca-certificates \
              python3 \
              python3-pip \
              python3-venv \
              build-essential \
              gcc \
              g++ \
              make \
              tmux \
              htop \
              jq \
              rsync \
              zsh \
              iproute2 \
              iputils-ping \
              dnsutils \
              net-tools

          # ------------------------------------------------------
          # Create SSH runtime directory
          # ------------------------------------------------------
          echo ""
          echo "🔐 Preparing SSH..."

          docker exec cynet-ubuntu \
            mkdir -p /run/sshd

          # ------------------------------------------------------
          # Generate SSH host keys
          # ------------------------------------------------------
          docker exec cynet-ubuntu \
            ssh-keygen -A

          # ------------------------------------------------------
          # Set root password
          # ------------------------------------------------------
          echo ""
          echo "🔑 Setting SSH password..."

          printf 'root:%s\n' "$SSH_PASSWORD" \
            | docker exec -i cynet-ubuntu chpasswd

          # ------------------------------------------------------
          # SSH configuration
          # ------------------------------------------------------
          docker exec cynet-ubuntu bash -c '
            cat > /etc/ssh/sshd_config.d/cynet.conf << "EOF"
          Port 22
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM yes
          PrintMotd no
          X11Forwarding no
          EOF
          '

          # ------------------------------------------------------
          # Validate SSH configuration
          # ------------------------------------------------------
          echo ""
          echo "🔍 Checking SSH configuration..."

          docker exec cynet-ubuntu \
            /usr/sbin/sshd -t

          # ------------------------------------------------------
          # Start SSH server
          # ------------------------------------------------------
          echo ""
          echo "🚀 Starting SSH server..."

          docker exec -d cynet-ubuntu \
            /usr/sbin/sshd -D

          sleep 3

          # ------------------------------------------------------
          # Verify SSH
          # ------------------------------------------------------
          echo ""
          echo "🔍 Checking port 22..."

          if docker exec cynet-ubuntu \
            bash -c "ss -lnt | grep -q ':22 '"; then

            echo "✅ SSH is listening on port 22"

          else

            echo "❌ SSH is NOT listening!"
            echo ""
            echo "SSH processes:"
            docker exec cynet-ubuntu \
              ps aux | grep '[s]shd' || true

            echo ""
            echo "Listening ports:"
            docker exec cynet-ubuntu \
              ss -lnt || true

            exit 1
          fi

          echo ""
          echo "=========================================================="
          echo "  ✅ UBUNTU 24.04 READY"
          echo "  ✅ SSH SERVER READY"
          echo "=========================================================="


      # ==========================================================
      # 2. START NGROK TCP
      # ==========================================================
      - name: 🌐 Start ngrok SSH Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

        run: |
          set -e

          echo ""
          echo "=========================================================="
          echo "  🌐 STARTING NGROK TCP TUNNEL"
          echo "=========================================================="

          # ------------------------------------------------------
          # Configure ngrok
          # ------------------------------------------------------
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # ------------------------------------------------------
          # Start TCP tunnel
          # ------------------------------------------------------
          nohup ngrok tcp 22 > ngrok.log 2>&1 &

          NGROK_PID=$!

          echo "ngrok PID: $NGROK_PID"

          # ------------------------------------------------------
          # Wait for ngrok API
          # ------------------------------------------------------
          echo ""
          echo "⏳ Waiting for ngrok..."

          NGROK_URL=""

          for i in {1..30}; do

            sleep 2

            echo "Checking ngrok... $i/30"

            # Check process
            if ! kill -0 "$NGROK_PID" 2>/dev/null; then

              echo ""
              echo "❌ ngrok stopped unexpectedly!"
              echo ""
              echo "================ ngrok.log ================"
              cat ngrok.log || true
              echo "============================================"

              exit 1
            fi

            # Check API
            if curl -fsS \
              http://127.0.0.1:4040/api/tunnels \
              -o /tmp/ngrok.json 2>/dev/null; then

              NGROK_URL=$(
                python3 -c '
          import json

          try:
              with open("/tmp/ngrok.json") as f:
                  data = json.load(f)

              for tunnel in data.get("tunnels", []):
                  url = tunnel.get("public_url", "")

                  if url.startswith("tcp://"):
                      print(url)
                      break

          except Exception:
              pass
                ' 2>/dev/null || true
              )

              if [ -n "$NGROK_URL" ]; then
                break
              fi

            fi

          done

          # ------------------------------------------------------
          # If ngrok failed
          # ------------------------------------------------------
          if [ -z "$NGROK_URL" ]; then

            echo ""
            echo "=========================================================="
            echo "  ❌ NGROK FAILED"
            echo "=========================================================="

            echo ""
            echo "--------------- ngrok.log ----------------"
            cat ngrok.log || true
            echo "-------------------------------------------"

            echo ""
            echo "--------------- ngrok process ------------"
            ps aux | grep '[n]grok' || true

            echo ""
            echo "--------------- ngrok API ----------------"
            curl -v http://127.0.0.1:4040/api/tunnels || true

            exit 1
          fi

          # ------------------------------------------------------
          # Parse address
          # ------------------------------------------------------
          ADDRESS="${NGROK_URL#tcp://}"

          HOST="${ADDRESS%:*}"
          PORT="${ADDRESS##*:}"

          # ------------------------------------------------------
          # Show SSH information
          # ------------------------------------------------------
          echo ""
          echo ""
          echo "=========================================================="
          echo "  🔥 YOUR UBUNTU SSH SERVER IS LIVE!"
          echo "=========================================================="
          echo ""
          echo "  🖥️ OS       : Ubuntu 24.04"
          echo "  🔐 Service  : SSH"
          echo "  👤 Username : root"
          echo "  🌐 Host     : $HOST"
          echo "  🔌 Port     : $PORT"
          echo ""
          echo "----------------------------------------------------------"
          echo "  SSH COMMAND"
          echo "----------------------------------------------------------"
          echo ""
          echo "  ssh root@$HOST -p $PORT"
          echo ""
          echo "=========================================================="
          echo "  ⏳ ONLINE UNTIL GITHUB JOB ENDS"
          echo "=========================================================="
          echo ""

          # ------------------------------------------------------
          # Keep job alive
          # ------------------------------------------------------
          tail -f ngrok.log
